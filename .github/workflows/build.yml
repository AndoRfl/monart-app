name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configuration du JDK Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Configuration du SDK Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Génération du projet Android natif
      - run: flutter create --platforms=android . --org com.monart.app

      # Ingestion de la permission Cleartext (HTTP) dans le Manifest Android
      - name: Autoriser les flux HTTP locaux
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      # Installation des dépendances Dart
      - run: flutter pub get

      # Compilation de l'APK Release
      - run: flutter build apk --release

      # Génération de l'artefact téléchargeable
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
