name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Java JDK (nécessaire pour la compilation Android)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Génération du projet Android si manquant
      - run: flutter create --platforms=android . --org com.monart.app

      # Installation des dépendances
      - run: flutter pub add http
      - run: flutter pub get

      # Build de l'APK
      - run: flutter build apk --release

      # Téléchargement de l'APK généré
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
