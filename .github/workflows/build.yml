name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configuration du JDK Java 17 pour Gradle / Android
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Configuration du SDK Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Génération de la structure native Android
      - run: flutter create --platforms=android . --org com.monart.app

      # Installation du package http et des dépendances
      - run: flutter pub add http
      - run: flutter pub get

      # Compilation de l'APK Release
      - run: flutter build apk --release

      # Mettre le fichier APK à disposition en téléchargement
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
